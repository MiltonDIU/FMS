name: Deploy FMS to VPS
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            # Add NVM Node and NPM directly to PATH
            export PATH="/home/ubuntu/.nvm/versions/node/v24.20.0/bin:/usr/local/bin:$PATH"
            export NVM_DIR="/home/ubuntu/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /var/www/faculty

            # Clear stale caches first
            rm -f bootstrap/cache/*.php || true

            # Fetch and force reset to latest main
            git fetch origin main
            git reset --hard origin/main

            # Install PHP dependencies
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Install & build frontend assets
            npm install
            chmod -R +x node_modules/.bin || true
            npm run build

            # Database migrations & Filament
            php artisan migrate --force
            php artisan filament:upgrade

            # Optimize & cache
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Fix file & directory permissions after build
            find . -type d -exec chmod 755 {} + || true
            find . -type f -exec chmod 644 {} + || true
            chmod -R 775 storage bootstrap/cache || true
            chmod +x artisan || true
            php artisan queue:restart || true

